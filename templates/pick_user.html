<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lz GYMTRAK | Who's training?</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}" aria-label="Lz GYMTRAK dashboard">
      <img class="brand-logo" src="{{ url_for('static', filename='gymtrak-logo.svg', v=2) }}" alt="LZ GYMTRAK">
    </a>
    <div class="topbar-note"><span class="status-dot"></span> YOUR TRAINING, IN MOTION</div>
  </header>

  <main class="page-shell">
    <section class="welcome-row">
      <div>
        <p class="eyebrow">LZ GYMTRAK</p>
        <h1>Who's training today?</h1>
        <p class="intro">Pick a profile to see your own workouts, streak, and personal records.</p>
      </div>
    </section>

    <section class="section-block log-section">
      {% for key, name in users.items() %}
        <form action="{{ url_for('switch_user') }}" method="post">
          <input type="hidden" name="user" value="{{ key }}">
          <button class="save-button" type="submit">I'm {{ name }} <span aria-hidden="true">→</span></button>
        </form>
      {% endfor %}
    </section>
    <footer class="page-footer"><span>LZ GYMTRAK</span><span>Progress is built one session at a time.</span></footer>
  </main>
</body>
</html>
